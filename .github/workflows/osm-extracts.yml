name: OpenStreetMap copy (per market)
# Tobler's own copy of OpenStreetMap, so site checks don't wait on the public Overpass servers (25 Nov).
# Downloads each market's Geofabrik extracts, keeps only the kinds in catalogue/osm-snapshot.json, writes FlatGeobuf
# (and GeoParquet) per extract and group, and uploads them to R2 when the repo variable OSM_R2_BUCKET is set.
# Without it, it only builds and commits a size report (data/osm-extracts/), which is how the cost estimate was made.
# Runs by hand, when .github/osm-extract-request changes, and weekly once the bucket is set.
on:
  workflow_dispatch:
    inputs:
      market: { description: "uk, nl, au or us", default: "uk" }
      parquet: { description: "Also write GeoParquet (yes/no)", default: "yes" }
      sizes: { description: "Also list every market's extract sizes (yes/no)", default: "no" }
  push:
    branches: [main, osm-copy]
    paths: [".github/osm-extract-request"]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
  actions: read # publish-only: read another run's stats artifacts
concurrency: osm-extracts
env:
  UA: "Tobler OSM extract builder (github.com/pushpingeo/tobler)"
jobs:
  plan:
    if: github.event_name != 'schedule' || vars.OSM_R2_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      market: ${{ steps.p.outputs.market }}
      parquet: ${{ steps.p.outputs.parquet }}
      release: ${{ steps.p.outputs.release }}
      publish_only: ${{ steps.p.outputs.publish_only }}
      stats_from: ${{ steps.p.outputs.stats_from }}
    env:
      BUCKET: ${{ vars.OSM_R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: env.BUCKET != ''
        with: { node-version: 22 }
      - name: Can the token write to the bucket? (fail in a minute, not after the build)
        if: env.BUCKET != ''
        run: |
          echo "probe $(date -u +%FT%TZ)" > probe.txt
          npx -y wrangler@4 r2 object put "$BUCKET/osm/_probe.txt" --file probe.txt --remote --content-type text/plain \
            || { echo "::error::The Cloudflare token can't write to R2 bucket $BUCKET: add Account / Workers R2 Storage / Edit to it"; exit 1; }
          # The build uploads through R2's S3 API (multipart, for files over wrangler's 300 MiB): check that route too.
          S3ENV=$(scripts/osm-extract/r2-s3-env.sh) || exit 1; eval "$S3ENV"; echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          aws s3 cp probe.txt "s3://$BUCKET/osm/_probe-s3.txt" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || { echo "::error::R2's S3 API refused the token's derived credentials for bucket $BUCKET"; exit 1; }
      - run: pip install -q osmium shapely
      - id: p
        working-directory: scripts/osm-extract
        run: |
          # The request file: "market [parquet] [sizes]", e.g. "uk parquet sizes". Lines starting # are notes.
          REQ=$(grep -v '^#' ../../.github/osm-extract-request 2>/dev/null | head -1 || true)
          MARKET="${{ github.event.inputs.market }}"; PARQUET="${{ github.event.inputs.parquet }}"; SIZES="${{ github.event.inputs.sizes }}"
          if [ -z "$MARKET" ]; then MARKET=$(echo "$REQ" | awk '{print $1}'); fi
          [ -z "$MARKET" ] && MARKET=uk
          echo "$REQ" | grep -qw parquet && PARQUET=yes
          echo "$REQ" | grep -qw sizes && SIZES=yes
          # "publish-only stats-from <run id>": no build; rebuild the manifest from that run's stats (same day's release)
          # and the live manifest. For when files are already in the bucket but a manifest left them out.
          echo "publish_only=$(echo "$REQ" | grep -qw publish-only && echo yes || echo no)" >> $GITHUB_OUTPUT
          echo "stats_from=$(echo "$REQ" | grep -oP 'stats-from \K[0-9]+' || true)" >> $GITHUB_OUTPUT
          echo "market=$MARKET" >> $GITHUB_OUTPUT
          echo "parquet=${PARQUET:-no}" >> $GITHUB_OUTPUT
          echo "release=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          if echo "$REQ" | grep -qw publish-only; then echo 'shards=[]' >> $GITHUB_OUTPUT; exit 0; fi # the earlier run's plan is used
          curl -sfL -A "$UA" --retry 3 -o index-v1.json https://download.geofabrik.de/index-v1.json
          python3 plan.py --market "$MARKET" --index index-v1.json --out regions.json --shards 6
          if [ "$SIZES" = "yes" ]; then python3 plan.py --sizes --index index-v1.json --out sizes.json; fi
          echo "shards=$(python3 -c "import json;print(json.dumps(sorted({r['shard'] for r in json.load(open('regions.json'))['regions']})))")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            scripts/osm-extract/regions.json
            scripts/osm-extract/sizes.json
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: plan
    if: needs.plan.outputs.publish_only != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      BUCKET: ${{ vars.OSM_R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: env.BUCKET != ''
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q osmium shapely geopandas pyogrio pyarrow
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - name: Build this shard's extracts
        working-directory: scripts/osm-extract
        run: |
          FILTER=$(python3 build.py --print-filter)
          for row in $(python3 -c "import json;[print(r['id']+'|'+r['pbf']) for r in json.load(open('../../plan/regions.json'))['regions'] if r['shard']==${{ matrix.shard }}]"); do
            id=${row%%|*}; url=${row#*|}
            echo "::group::$id"
            # Geofabrik: retry with pauses (it slows or refuses heavy users), and say what it answered if it fails.
            code=$(curl -sL -A "$UA" --retry 4 --retry-delay 30 --retry-all-errors -o in.osm.pbf -w '%{http_code}' "$url" || true)
            if [ "$code" != "200" ]; then echo "::warning::$id: download failed (HTTP $code)"; rm -f in.osm.pbf; echo "::endgroup::"; continue; fi
            osmium tags-filter --overwrite -o filtered.osm.pbf in.osm.pbf $FILTER
            python3 build.py --pbf filtered.osm.pbf --region "$id" --out "../../out/$id" --source-bytes $(stat -c %s in.osm.pbf) \
              ${{ needs.plan.outputs.parquet == 'yes' && '--parquet' || '' }} || echo "::warning::$id: build failed"
            rm -f in.osm.pbf filtered.osm.pbf
            echo "::endgroup::"
          done
      - name: Upload to R2 (S3 API, multipart for big files)
        if: env.BUCKET != ''
        run: |
          S3ENV=$(scripts/osm-extract/r2-s3-env.sh) || exit 1; eval "$S3ENV"; echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          failed=0
          for d in out/*/; do [ -d "$d" ] || continue; id=$(basename "$d")
            # An extract whose files didn't all go up is left out of this run's stats (the live release's entry for it
            # is carried instead, if recent). One retry after a pause.
            up() { aws s3 cp "$d" "s3://$BUCKET/osm/${{ needs.plan.outputs.release }}/$id/" --recursive --exclude "*" --include "*.fgb" --include "*.parquet" \
                 --endpoint-url "$R2_ENDPOINT" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable" --only-show-errors; }
            if ! up && ! { sleep 20; up; }; then
              echo "::warning::$id: upload failed; left out of this release"; rm -f "$d/stats.json"; failed=1
            fi
          done
          [ "$failed" = 0 ] || echo "::warning::some extracts weren't uploaded"
      - uses: actions/upload-artifact@v4
        with:
          name: stats-${{ matrix.shard }}
          path: out/*/stats.json
          retention-days: 3

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: ${{ vars.OSM_R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -q osmium shapely
      - uses: actions/download-artifact@v4
        continue-on-error: true # a publish-only run has none of its own
        with: { path: art }
      - name: Stats (and plan) from an earlier run (publish-only)
        if: needs.plan.outputs.stats_from != ''
        uses: actions/download-artifact@v4
        with: { path: art-earlier, run-id: "${{ needs.plan.outputs.stats_from }}", github-token: "${{ github.token }}" }
      - name: The live manifest (extracts this run didn't build keep their entry, if recent)
        if: env.BUCKET != ''
        run: |
          S3ENV=$(scripts/osm-extract/r2-s3-env.sh) || exit 1; eval "$S3ENV"; echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          aws s3 cp "s3://$BUCKET/osm/${{ needs.plan.outputs.market }}.json" live.json --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || echo "::notice::no live manifest yet"
      - name: Manifest and report
        run: |
          M=${{ needs.plan.outputs.market }}; R=${{ needs.plan.outputs.release }}
          mkdir -p data/osm-extracts art-earlier
          PLAN=art/plan/regions.json; [ -f "$PLAN" ] || PLAN=art-earlier/plan/regions.json
          python3 scripts/osm-extract/publish.py --regions "$PLAN" --stats-dir art --stats-dir art-earlier --release "$R" \
            --previous live.json --out manifest.json --report "data/osm-extracts/report-$M.json" || echo "::warning::some extracts are missing from this release"
          [ -f art/plan/sizes.json ] && cp art/plan/sizes.json data/osm-extracts/geofabrik-sizes.json || true
      - name: Publish the manifest last (so readers never see half a release)
        if: env.BUCKET != ''
        run: |
          npx -y wrangler@4 r2 object put "$BUCKET/osm/${{ needs.plan.outputs.market }}.json" --file manifest.json --remote \
            --content-type application/json --cache-control "public, max-age=300"
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may have committed a report since this one checked out: put this report on the newest main.
          cp -r data/osm-extracts /tmp/osm-extracts
          git fetch -q origin main && git reset -q --hard origin/main
          mkdir -p data/osm-extracts && cp -r /tmp/osm-extracts/. data/osm-extracts/
          git add data/osm-extracts
          git diff --cached --quiet || git commit -m "OpenStreetMap copy: ${{ needs.plan.outputs.market }} report"
          git push origin HEAD:main
